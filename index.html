<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Dispatch Services | Premium US Truck Dispatching</title>
    <!-- Font Awesome Icons for professional look -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Modern CSS Variables for premium corporate aesthetics */
        :root {
            --primary: #0f172a;    /* Deep Executive Navy */
            --secondary: #0ea5e9;  /* High-Converting Vivid Blue */
            --accent: #f59e0b;     /* Premium Cargo Amber */
            --light: #f8fafc;      /* Modern Soft Background */
            --text: #334155;       /* Sharp Corporate Charcoal */
            --whatsapp: #25d366;   /* Authentic WhatsApp Green */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--light);
            color: var(--text);
            line-height: 1.6;
        }

        /* Top Bar Info */
        .top-bar {
            background-color: #020617;
            color: #94a3b8;
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            border-bottom: 1px solid #1e293b;
        }
        .top-bar-contact {
            display: flex;
            gap: 20px;
        }
        .top-bar a { 
            color: #f8fafc; 
            text-decoration: none; 
            transition: 0.3s;
            font-weight: 500;
        }
        .top-bar a:hover { color: var(--secondary); }

        /* Navigation Header */
        header {
            background-color: var(--primary);
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .logo {
            font-size: 1.7rem;
            font-weight: 800;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.5px;
        }
        .logo span { color: var(--secondary); }
        
        nav {
            display: flex;
            align-items: center;
        }
        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        nav a:hover { color: var(--secondary); }
        nav .nav-btn {
            background-color: transparent;
            border: 2px solid var(--secondary);
            color: var(--secondary);
            padding: 8px 18px;
            border-radius: 5px;
        }
        nav .nav-btn:hover {
            background-color: var(--secondary);
            color: white;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.9)), url('https://unsplash.com') no-repeat center center/cover;
            color: white;
            padding: 140px 5%;
            text-align: center;
        }
        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: -1px;
            line-height: 1.2;
        }
        .hero p {
            font-size: 1.3rem;
            max-width: 800px;
            margin: 0 auto 40px;
            color: #cbd5e1;
        }
        
        /* Interactive Button Groups */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 15px 40px;
            text-decoration: none;
            font-weight: 700;
            border-radius: 6px;
            font-size: 1.05rem;
            transition: 0.3s transform, 0.3s background, 0.3s box-shadow;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .btn-primary { background-color: var(--secondary); color: white; }
        .btn-secondary { background-color: var(--whatsapp); color: white; }

        /* Features Section */
        .section-container {
            padding: 90px 5% 60px;
        }
        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--primary);
            font-weight: 800;
        }
        .section-subtitle {
            text-align: center;
            color: #64748b;
            max-width: 600px;
            margin: 0 auto 50px;
            font-size: 1.1rem;
        }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .service-card {
            background: white;
            padding: 45px 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.03);
            border-top: 5px solid transparent;
            transition: 0.3s;
        }
        .service-card:hover {
            transform: translateY(-8px);
            border-top-color: var(--secondary);
            box-shadow: 0 20px 40px rgba(14, 165, 233, 0.12);
        }
        .service-card i {
            font-size: 2.8rem;
            color: var(--secondary);
            margin-bottom: 25px;
        }
        .service-card h3 { 
            margin-bottom: 15px; 
            color: var(--primary);
            font-size: 1.4rem;
        }

        /* Equipment Fleet Section */
        .equipment {
            background-color: #f1f5f9;
            padding: 80px 5%;
            text-align: center;
        }
        .eq-flex {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 40px;
        }
        .eq-badge {
            background: white;
            padding: 18px 35px;
            border-radius: 50px;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .eq-badge:hover {
            background-color: var(--primary);
            color: white;
        }
        .eq-badge i { color: var(--secondary); }

        /* Form Container Setup */
        .setup-section {
            padding: 100px 5%;
            display: flex;
            justify-content: center;
            background: white;
        }
        .form-box {
            background: var(--light);
            padding: 50px;
            border-radius: 16px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
        }
        .form-box h2 { text-align: center; margin-bottom: 10px; color: var(--primary); font-size: 2.2rem; }
        .form-box p { text-align: center; color: #64748b; margin-bottom: 35px; }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 600; font-size: 0.95rem; color: var(--primary); }
        .form-group input, .form-group select {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
        }
        .submit-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
        }
        .submit-btn:hover { 
            background-color: #1e293b;
            transform: translateY(-2px);
        }

        /* Floating Modern WhatsApp Widget */
        .whatsapp-float {
            position: fixed;
            bottom: 35px;
            right: 35px;
            background-color: var(--whatsapp);
            color: white;
            width: 65px;
            height: 65px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
            z-index: 1000;
            text-decoration: none;
            transition: 0.3s transform, 0.3s background;
        }
        .whatsapp-float:hover { 
            transform: scale(1.1) rotate(5deg); 
            background-color: #20ba5a;
        }

        /* Footer */
        footer {
            background-color: #020617;
            color: #64748b;
            text-align: center;
            padding: 40px 20px;
            font-size: 0.95rem;
            border-top: 1px solid #1e293b;
        }
        footer p { margin-bottom: 10px; }
        footer a { color: #94a3b8; text-decoration: none; }
